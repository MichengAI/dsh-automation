# 一次安装同时挂载 Host 服务并发布 Web 客户端。
# 新版 Connection 的独立 RPC 注册在自身作用域读取 webServer，需显式注入。
# 此列表替换官方 Web bundle 的 [webRuntime]；插件源码声明的依赖仍由 Loader 合并。
- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  inject:
    - webServer
    - webRuntime
- insert:
    - id: dsh-automation
      name: '@michengai/dsh-automation'
      config:
        runTimeoutMinutes: 60
        misfireGraceMinutes: 15
        historyLimit: 200
